version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netforge
      POSTGRES_PASSWORD: netforge_secret
      POSTGRES_DB: netforge
    ports:
      - "5432:5432"
    volumes:
      - netforge_pgdata:/var/lib/postgresql/data
volumes:
  netforge_pgdata: